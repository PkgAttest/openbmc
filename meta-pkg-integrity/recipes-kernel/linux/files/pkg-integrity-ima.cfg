# IMA, measurement only. Enabled for image E via PKG_INTEGRITY_IMA = "1".
#
# Measurement, not appraisal. IMA_APPRAISE is deliberately left off: it
# refuses files whose security.ima xattr does not verify, which turns a
# missing signature into an unbootable board, and it needs a signing key in
# the kernel keyring that this demo does not have. What pkgattest verify-ima
# consumes is the measurement log, which appraisal is not needed to produce.
CONFIG_INTEGRITY=y
CONFIG_IMA=y

# PCR 10 is where IMA extends. Nothing here touches PCR 14, which carries
# the pkg-merkle-v1 device root, so the two live side by side.
CONFIG_IMA_MEASURE_PCR_IDX=10

# ima-ng is what pkgintegrity/imalog.py parses: it carries the pathname and
# a named digest algorithm. The older "ima" template is sha1-only and
# truncates paths, which would make the cross-reference impossible.
CONFIG_IMA_NG_TEMPLATE=y
CONFIG_IMA_DEFAULT_TEMPLATE="ima-ng"

# sha256, to match pkg-leaf-v1. A sha1 log cannot be compared against these
# measurements at all -- imalog.py reports those events as "incomparable"
# rather than accusing them, but the run is then worthless.
CONFIG_IMA_DEFAULT_HASH_SHA256=y
CONFIG_IMA_DEFAULT_HASH="sha256"

# Load a narrower policy at runtime through securityfs, and read back what is
# in force. READ_POLICY matters for the demo: an operator has to be able to
# show which rules produced the log.
CONFIG_IMA_WRITE_POLICY=y
CONFIG_IMA_READ_POLICY=y

# LSM-conditioned rules (obj_type=, subj_user= ...). Not used by the shipped
# policy, but a site policy that wants them cannot add them later without a
# kernel rebuild.
CONFIG_IMA_LSM_RULES=y

CONFIG_SECURITYFS=y
CONFIG_CRYPTO_SHA256=y

# CONFIG_IMA selects TCG_TPM, which promotes it from the =m that
# vtpm-proxy.cfg asks for to =y. Three packages disappear as a result --
# kernel-module-tpm, kernel-module-sha1, kernel-module-libsha1 all became
# built-in -- which is worth knowing before reading the log diff.
#
# It does not buy a PCR 10 extend. This board has no TPM chip; the demo's
# TPM is swtpm reached through CONFIG_TCG_VTPM_PROXY, still =m and still
# dependent on a userspace daemon that starts long after IMA initialises.
# IMA therefore finds no chip at init and runs in what the kernel calls
# TPM-bypass: ascii_runtime_measurements is written in full -- and that log
# is the only thing pkgattest verify-ima consumes -- but nothing extends
# PCR 10 and no quote can vouch for it. Closing that needs a real TPM
# present at boot, not a proxy that appears late.
